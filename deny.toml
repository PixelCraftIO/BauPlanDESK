# cargo-deny-Konfiguration: https://embarkstudios.github.io/cargo-deny/
#
#   cargo install cargo-deny --locked
#   cargo deny check
#
# Kommerzieller Vertrieb: Nur permissive Lizenzen sind erlaubt.
# GPL, AGPL und LGPL sind ausgeschlossen, weil sie nicht in der Liste stehen.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    # MPL-2.0 ist ein schwaches, dateibezogenes Copyleft: Nutzung in proprietärer
    # Software ist erlaubt, nur Änderungen an MPL-Dateien selbst müssen offen
    # bleiben. Kommt über Tauri (cssparser, selectors, …) und Rhai (smartstring).
    "MPL-2.0",
]
# 0BSD ist gemeinfrei-gleich (ohne Namensnennungspflicht); nur für dieses Crate
# freigegeben (quoted_printable über lettre, tägliche Fristen-E-Mail des Servers).
exceptions = [
    { allow = ["0BSD"], crate = "quoted_printable" },
]

# Eigene Crates sind proprietär und werden nicht veröffentlicht.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Offizieller Updater-Sicherheitsfix, im Desktop-Manifest auf einen Commit fixiert.
allow-git = ["https://github.com/tauri-apps/plugins-workspace"]

[advisories]
# Nur direkte Abhängigkeiten auf "unmaintained" prüfen; der GTK3-Stack von
# Tauri unter Linux ist bekanntermaßen nicht mehr gepflegt.
unmaintained = "workspace"
