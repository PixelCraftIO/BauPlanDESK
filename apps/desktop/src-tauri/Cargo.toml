[package]
name = "bauprojektio-desktop"
description = "BauPlanDESK Desktop-App (Tauri). Dünne Schicht über core-lib."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bauprojektio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
async-trait.workspace = true
client-cache.workspace = true
core-lib.workspace = true
db-postgres.workspace = true
db-sqlite.workspace = true
hex.workspace = true
# Machine-ID für Abo-Lizenzen (MIT)
machine-uid = "0.6"
# Lizenzserver (TLS über rustls wie object_store, Proxy des Systems)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
storage = { workspace = true, features = ["s3"] }
tauri = { version = "2", features = [] }
# Upstream-Sicherheitsfix für zip 9; nach Veröffentlichung auf crates.io zurückstellen.
tauri-plugin-updater = { version = "2.14", git = "https://github.com/tauri-apps/plugins-workspace", rev = "ba98bfadc4c868c9a7e1a226c83af528e1f11b89" }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tokio = { workspace = true, features = ["time", "process", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
whoami = "1.6"
uuid.workspace = true
bytes.workspace = true
base64.workspace = true

[dev-dependencies]
core-lib = { workspace = true, features = ["testdaten"] }
tauri = { version = "2", features = ["test"] }
tempfile.workspace = true
