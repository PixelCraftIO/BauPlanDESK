name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      # Für die PostgreSQL-Tests (db-postgres, lizenz-server).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bp
          POSTGRES_PASSWORD: bp
          POSTGRES_DB: bp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BAUPROJEKT_TEST_POSTGRES: postgres://bp:bp@localhost:5432/bp
    steps:
      - uses: actions/checkout@v4
      # Workspace samt Tauri-App und Cache sprengt sonst die ~14 GB des
      # Runners (Linker-Absturz „Bus error“, „running out of disk space“).
      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Tauri-Systembibliotheken, xmllint (XBau-Schemaprüfung)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libxml2-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Frontend bauen (wird von generate_context! eingebettet)
        working-directory: apps/desktop
        run: npm ci && npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  lizenzen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: npm-Lizenzen
        working-directory: apps/desktop
        run: npm ci && npm run licenses

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: apps/desktop
        run: npm ci && npm run check && npm run build
