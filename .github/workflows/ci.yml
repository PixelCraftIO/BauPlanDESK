name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      # Für die PostgreSQL-Tests (db-postgres, lizenz-server).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bp
          POSTGRES_PASSWORD: bp
          POSTGRES_DB: bp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BAUPROJEKT_TEST_POSTGRES: postgres://bp:bp@localhost:5432/bp
      BAUPROJEKT_TEST_POSTGRES_URL: postgres://bp:bp@localhost:5432/bp
      BAUPROJEKT_TEST_BUERO_SICHERUNG: postgres://bp:bp@localhost:5432/bp
      BAUPROJEKT_TEST_OCR: "1"
    steps:
      - uses: actions/checkout@v4
      # Workspace samt Tauri-App und Cache sprengt sonst die ~14 GB des
      # Runners (Linker-Absturz „Bus error“, „running out of disk space“).
      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Tauri-Systembibliotheken, xmllint (XBau-Schemaprüfung)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libxml2-utils postgresql-client-16 tesseract-ocr-deu tesseract-ocr-eng
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Frontend bauen (wird von generate_context! eingebettet)
        working-directory: apps/desktop
        run: npm ci && npm run build
      - name: XBau-Katalog mit offiziellen Schemas abgleichen
        run: python3 scripts/xbau-katalog.py --check
      - name: Generierte Plattformverträge prüfen
        run: |
          cargo run -p core-lib --example vertraege --locked > /tmp/plattform.ts
          diff -u apps/desktop/src/lib/generated/plattform.ts /tmp/plattform.ts
      - name: PostgreSQL-Clientversion für Sicherungstests festlegen
        run: echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  lizenzen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: npm-Lizenzen
        working-directory: apps/desktop
        run: npm ci && npm run licenses

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --test apps/desktop/tests/release-check.test.mjs apps/desktop/tests/feld-darstellung.test.mjs apps/desktop/tests/handbuch.test.mjs apps/desktop/tests/arbeitsplatz.test.mjs apps/desktop/tests/workflow-quellen.test.mjs apps/desktop/tests/vergleichsform.test.mjs
      - working-directory: apps/desktop
        run: npm ci && npm run check && npm run build

  ui:
    runs-on: ubuntu-24.04
    env:
      BAUPROJEKT_UI_URL: http://127.0.0.1:1430
      BAUPROJEKT_PDF_ARTEFAKTE: /tmp/bauprojekt-pdf
      BAUPROJEKT_EINREICHUNG_ARTEFAKTE: /tmp/bauprojekt-einreichungen
      BAUPROJEKT_PDF_LIVE_ARTEFAKTE: /tmp/bauprojekt-pdf-live
      BAUPROJEKT_KATEGORIEN_ARTEFAKTE: /tmp/bauprojekt-kategorien
      BAUPROJEKT_EMAIL_ARTEFAKTE: /tmp/bauprojekt-emails
      BAUPROJEKT_DRUCK_ARTEFAKTE: /tmp/bauprojekt-druck
      BAUPROJEKT_VERFAHREN_ARTEFAKTE: /tmp/bauprojekt-verfahren
      BAUPROJEKT_ABSTAND_ARTEFAKTE: /tmp/bauprojekt-abstand
      BAUPROJEKT_FACH_ARTEFAKTE: /tmp/bauprojekt-fach
      BAUPROJEKT_UEBERSICHT_ARTEFAKTE: /tmp/bauprojekt-uebersicht
      BAUPROJEKT_XBAU_ARTEFAKTE: /tmp/bauprojekt-xbau
      BAUPROJEKT_PORTAL_ARTEFAKTE: /tmp/bauprojekt-portale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install playwright==1.62.0 && python -m playwright install --with-deps chromium
      - name: Browserpfad bereitstellen
        run: |
          python - <<'PYCODE' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('BAUPROJEKT_CHROMIUM=' + p.chromium.executable_path)
          PYCODE
      - name: XBau-Laufzeitvalidator installieren
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Echte PDF- und Paket-Testdaten erzeugen
        run: cargo test -p storage --test formular_workflow --test einreichungen --test pdf_livevorschau --test dokumentkategorien --test emails --test druckausgabe --test verfahren --test abstandsflaechen --test fachberechnungen --test projektuebersicht --test xbau --test portale --locked
      - working-directory: apps/desktop
        run: npm ci && npm run check && npm run build
      - name: Produktionsoberfläche prüfen
        run: |
          python -m http.server 1430 --bind 127.0.0.1 --directory apps/desktop/dist > /tmp/bauprojekt-ui.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PYCODE'
          import time, urllib.request
          for attempt in range(40):
              try:
                  urllib.request.urlopen('http://127.0.0.1:1430', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise RuntimeError('UI-Testserver nicht erreichbar')
          PYCODE
          node --test apps/desktop/tests/live-pdf-vorschau.test.mjs
          node --test apps/desktop/tests/planaufmass.test.mjs apps/desktop/tests/planbearbeitung.test.mjs
          python apps/desktop/tests/planbearbeitung.py
          python apps/desktop/tests/cadaufmass.py
          python apps/desktop/tests/projekttabs.py
          python apps/desktop/tests/pdf-ablage.py
          python apps/desktop/tests/dateiverwaltung-einreichungen.py
          python apps/desktop/tests/plattform.py
          python apps/desktop/tests/pdf-livevorschau.py
          python apps/desktop/tests/dokumentkategorien.py
          python apps/desktop/tests/emails.py
          python apps/desktop/tests/druckausgabe.py
          python apps/desktop/tests/druckartefakt.py
          python apps/desktop/tests/verfahren.py
          python apps/desktop/tests/abstandsflaechen.py
          python apps/desktop/tests/fachberechnungen.py
          python apps/desktop/tests/workflow-ux.py
          python apps/desktop/tests/projektuebersicht.py
          python apps/desktop/tests/xbau.py
          python apps/desktop/tests/portale.py
          python apps/desktop/tests/updater.py
          python apps/desktop/tests/ui-felder-navigation.py
          python apps/desktop/tests/arbeitsplatz-ui.py
          python apps/desktop/tests/ansichtsabfragen.py
          python apps/desktop/tests/handbuch-ui.py
          python apps/desktop/tests/beispielprojekt.py
          python apps/desktop/tests/zeichnung.py
      - name: Editor- und Entwurfssicherung unter Fehlern prüfen
        run: |
          npm --prefix apps/desktop run dev -- --host 127.0.0.1 --port 1467 > /tmp/bauplan-stabilitaet-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid"' EXIT
          python - <<'PYCODE'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:1467', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise RuntimeError('Vite-Testserver nicht erreichbar')
          PYCODE
          python apps/desktop/tests/stabilitaet.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-pruefung
          path: |
            docs/ui-umsetzung
            docs/klare-projektstruktur
            docs/dateiverwaltung-einreichungen
            docs/pdf-livevorschau
            docs/dokumentkategorien
            docs/email-archiv
            docs/druckausgabe
            docs/verfahrensakte/screenshots
            docs/abstandsflaechen/screenshots
            /tmp/bauprojekt-fach
            /tmp/bauprojekt-fach-ui
            /tmp/bauprojekt-xbau
            /tmp/bauprojekt-xbau-ui
            /tmp/bauprojekt-portale
            /tmp/bauprojekt-portale-ui
            docs/projektuebersicht/screenshots
            /tmp/bauprojekt-uebersicht
            /tmp/bauprojekt-ui-felder
            /tmp/bauplan-handbuch-ui
            /tmp/bauplan-arbeitsplatz-ui
            /tmp/bauplan-zeichnung
            /tmp/bauplan-workflow-ui
            /tmp/bauprojekt-ui.log
