# Baut signierte Installer für Windows, macOS und Linux und veröffentlicht sie
# samt `latest.json` (Manifest für den Tauri-Updater) als GitHub-Release-Entwurf.
#
# Benötigte Repository-Secrets:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (Updater-Signatur)
# Benötigte Repository-Variable (kein Secret, der Schlüssel ist öffentlich):
#   BAUPROJEKT_UPDATER_PUBKEY     (öffentlicher Update-Signaturschlüssel)
# Optional BAUPROJEKT_UPDATE_URL (HTTPS-Manifest; sonst Lizenzserver/GitHub).
# BAUPROJEKT_LIZENZ_SCHLUESSEL ist optional; ohne gilt die Testversion.
# Für Abo-Lizenzen und Auto-Update über den eigenen Server (Variablen):
#   BAUPROJEKT_LIZENZSERVER       (https://lizenz.example.de, ohne / am Ende)
#   BAUPROJEKT_TICKET_SCHLUESSEL  (öffentlicher Ticket-Schlüssel des Servers)
#   BAUPROJEKT_UPDATER_PUBKEY     (Inhalt der .pub-Datei von `tauri signer generate`)
# Nach dem Veröffentlichen des Releases lädt `updates.yml` die Dateien auf
# den Server.
# Später zusätzlich für Code-Signing: Windows-Zertifikat, Apple-Developer-ID.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux-Abhängigkeiten
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Release-Version und Signierkonfiguration prüfen
        env:
          BAUPROJEKT_UPDATER_PUBKEY: ${{ vars.BAUPROJEKT_UPDATER_PUBKEY }}
          BAUPROJEKT_UPDATE_URL: ${{ vars.BAUPROJEKT_UPDATE_URL }}
          BAUPROJEKT_LIZENZSERVER: ${{ vars.BAUPROJEKT_LIZENZSERVER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node apps/desktop/scripts/release-check.mjs
      - working-directory: apps/desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BAUPROJEKT_LIZENZ_SCHLUESSEL: ${{ vars.BAUPROJEKT_LIZENZ_SCHLUESSEL }}
          BAUPROJEKT_LIZENZSERVER: ${{ vars.BAUPROJEKT_LIZENZSERVER }}
          BAUPROJEKT_TICKET_SCHLUESSEL: ${{ vars.BAUPROJEKT_TICKET_SCHLUESSEL }}
          BAUPROJEKT_UPDATER_PUBKEY: ${{ vars.BAUPROJEKT_UPDATER_PUBKEY }}
          BAUPROJEKT_UPDATE_URL: ${{ vars.BAUPROJEKT_UPDATE_URL }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: BauPlanIO v__VERSION__
          releaseDraft: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
