[workspace]
resolver = "3"
members = [
    "crates/core-lib",
    "crates/db-sqlite",
    "crates/db-postgres",
    "crates/storage",
    "crates/client-cache",
    "crates/server",
    "crates/lizenz-server",
    "apps/desktop/src-tauri",
    "tools/lizenz-werkzeug",
]
default-members = [
    "crates/core-lib",
    "crates/db-sqlite",
    "crates/db-postgres",
    "crates/storage",
    "crates/client-cache",
    "crates/server",
    "crates/lizenz-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/PixelCraftIO/BauPlanDESK"

# Zentrale Versionsverwaltung. Jede Abhängigkeit muss MIT/Apache-2.0/BSD o. ä.
# lizenziert sein; `cargo deny check licenses` (siehe deny.toml) erzwingt das.
[workspace.dependencies]
ts-rs = { version = "11", features = ["chrono-impl", "uuid-impl", "serde-json-impl", "no-serde-warnings"] }
core-lib = { path = "crates/core-lib" }
db-sqlite = { path = "crates/db-sqlite" }
db-postgres = { path = "crates/db-postgres" }
storage = { path = "crates/storage", default-features = false }
client-cache = { path = "crates/client-cache" }

async-trait = "0.1"
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
hex = "0.4"
rhai = { version = "1.26", features = ["sync", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "macros", "migrate", "uuid", "chrono"] }
object_store = { version = "0.14", default-features = false }
futures = "0.3"
geo = { version = "0.31.0", default-features = false }
axum = "0.8"
tempfile = "3"
skrifa = { version = "0.48", default-features = false, features = ["std"] }
lopdf = { version = "0.45", default-features = false }
dxf = "0.6"
# Lizenzdateien: Ed25519-Signaturen (BSD-3-Clause), Base64 (MIT/Apache-2.0)
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
base64 = "0.22"
# EML/MIME (Apache-2.0/MIT), Outlook-MSG-Container (MIT), Windows-Codepages.
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
cfb = "0.14"
encoding_rs = "0.8"
getrandom = "0.3"
# Passwort-Hashes der Benutzeranmeldung (Argon2id, MIT/Apache-2.0)
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
# XBau: Genericode-Codelisten lesen (MIT), ZIP-Pakete (MIT, Deflate über zlib-rs, Zlib)
quick-xml = "0.42"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Argon2id braucht ohne Optimierung mehrere Sekunden je Kennwortprüfung;
# auch Debug-Builds und Tests prüfen Kennwörter in normaler Zeit.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
