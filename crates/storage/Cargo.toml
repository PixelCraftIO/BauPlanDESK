[package]
name = "storage"
description = "Storage-Backends für das DMS: lokales Verzeichnis, NAS-Freigabe, S3-kompatibler Objektspeicher."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["s3"]
s3 = ["dep:object_store", "dep:futures"]

[dependencies]
sha2.workspace = true
zip.workspace = true
async-trait.workspace = true
bytes.workspace = true
core-lib.workspace = true
futures = { workspace = true, optional = true }
object_store = { workspace = true, optional = true, features = ["aws"] }
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
serde_json.workspace = true

[dev-dependencies]
lopdf.workspace = true
db-sqlite.workspace = true
core-lib = { workspace = true, features = ["testdaten"] }
tempfile.workspace = true
