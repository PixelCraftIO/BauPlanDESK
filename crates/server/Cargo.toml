[package]
name = "server"
description = "axum-Webserver für die NAS-/Büro- und Cloud-Variante. Bindet core-lib unverändert ein."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bauprojekt-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
core-lib.workspace = true
db-postgres.workspace = true
db-sqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
storage = { workspace = true, features = ["s3"] }
tokio = { workspace = true, features = ["net", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
bytes.workspace = true
core-lib = { workspace = true, features = ["testdaten"] }
tempfile.workspace = true
