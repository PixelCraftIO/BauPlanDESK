[package]
name = "server"
description = "axum-Webserver für die NAS-/Büro- und Cloud-Variante. Bindet core-lib unverändert ein."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bauprojekt-server"
path = "src/main.rs"

[dependencies]
base64.workspace = true
getrandom.workspace = true
# Tägliche Fristen-E-Mail im Netzwerkbetrieb (SMTP über rustls, MIT).
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
chrono.workspace = true
chrono-tz.workspace = true
axum.workspace = true
core-lib.workspace = true
db-postgres.workspace = true
db-sqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
storage = { workspace = true, features = ["s3"] }
tokio = { workspace = true, features = ["net", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
core-lib = { workspace = true, features = ["testdaten"] }
zip.workspace = true
