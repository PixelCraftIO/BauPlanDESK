[package]
name = "core-lib"
description = "Geschäftslogik von BauProjektIO: Berechnungen, LBO-Engine, Domänenmodell und Abstraktionen für Datenbank und Storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Bewusst KEINE Abhängigkeit auf sqlx, tauri, axum oder einen konkreten
# Storage-Client: core-lib kennt nur ihre eigenen Traits.
[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
hex.workspace = true
geo.workspace = true
dxf.workspace = true
ed25519-dalek.workspace = true
lopdf.workspace = true
ttf-parser.workspace = true
quick-xml.workspace = true
rhai.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
zip.workspace = true
ts-rs.workspace = true

[features]
# Stellt Beispiel-PDFs für Tests anderer Crates bereit.
testdaten = []

[dev-dependencies]
tokio.workspace = true

[[example]]
name = "musterformular"
required-features = ["testdaten"]

[[example]]
name = "musterplan"
required-features = ["testdaten"]

[[example]]
name = "testlizenz"
required-features = ["testdaten"]
