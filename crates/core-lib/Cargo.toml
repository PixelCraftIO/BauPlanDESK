[package]
name = "core-lib"
description = "Geschäftslogik von BauPlanIO: Berechnungen, LBO-Engine, Domänenmodell und Abstraktionen für Datenbank und Storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Bewusst KEINE Abhängigkeit auf sqlx, tauri, axum oder einen konkreten
# Storage-Client: core-lib kennt nur ihre eigenen Traits.
[dependencies]
url = "2"
async-trait.workspace = true
base64.workspace = true
mail-parser.workspace = true
cfb.workspace = true
encoding_rs.workspace = true
bytes.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
hex.workspace = true
geo.workspace = true
dxf.workspace = true
ed25519-dalek.workspace = true
lopdf.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
skrifa.workspace = true
quick-xml.workspace = true
rhai.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
argon2.workspace = true
getrandom.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
zip.workspace = true
ts-rs.workspace = true
# Nur Synchronisationsprimitive (Exportbegrenzung), keine Laufzeit und kein Dateisystem.
tokio = { version = "1", default-features = false, features = ["sync"] }

[features]
# Stellt Beispiel-PDFs für Tests anderer Crates bereit.
testdaten = []

[dev-dependencies]
tokio.workspace = true

[[example]]
name = "musterformular"
required-features = ["testdaten"]

[[example]]
name = "musterplan"
required-features = ["testdaten"]

[[example]]
name = "testlizenz"
required-features = ["testdaten"]

[[example]]
name = "ifc_fixture"
required-features = ["testdaten"]

[[example]]
name = "ifc_dateien"
required-features = ["testdaten"]
